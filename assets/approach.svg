<title id="t">How I build AI systems: plain code for anything exact, one model call only where judgement helps, schema validation, gold-set evaluation, explicit outcomes.</title>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><rect x="20" y="40" width="196" height="112" rx="14" fill="#0d1117" stroke="#7c5cff" stroke-width="2"/><circle cx="48" cy="70" r="13" fill="#7c5cff"/><text x="48" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">1</text><text x="38" y="114" font-size="18" font-weight="700" fill="#f0f6fc">Plain code</text><text x="38" y="138" font-size="13" fill="#9da7b3">for anything exact</text><line x1="222" y1="96" x2="251" y2="96" stroke="#7c5cff" stroke-width="2.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><path d="M249 90 L257 96 L249 102" fill="none" stroke="#7c5cff" stroke-width="2.5"/><rect x="261" y="40" width="196" height="112" rx="14" fill="#0d1117" stroke="#6b7cff" stroke-width="2"/><circle cx="289" cy="70" r="13" fill="#6b7cff"/><text x="289" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">2</text><text x="279" y="114" font-size="18" font-weight="700" fill="#f0f6fc">One model call</text><text x="279" y="138" font-size="13" fill="#9da7b3">only where judgement helps</text><line x1="463" y1="96" x2="492" y2="96" stroke="#6b7cff" stroke-width="2.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><path d="M490 90 L498 96 L490 102" fill="none" stroke="#6b7cff" stroke-width="2.5"/><rect x="502" y="40" width="196" height="112" rx="14" fill="#0d1117" stroke="#4f9cf5" stroke-width="2"/><circle cx="530" cy="70" r="13" fill="#4f9cf5"/><text x="530" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">3</text><text x="520" y="114" font-size="18" font-weight="700" fill="#f0f6fc">Schema validation</text><text x="520" y="138" font-size="13" fill="#9da7b3">reject or retry bad output</text><line x1="704" y1="96" x2="733" y2="96" stroke="#4f9cf5" stroke-width="2.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><path d="M731 90 L739 96 L731 102" fill="none" stroke="#4f9cf5" stroke-width="2.5"/><rect x="743" y="40" width="196" height="112" rx="14" fill="#0d1117" stroke="#2fb8ea" stroke-width="2"/><circle cx="771" cy="70" r="13" fill="#2fb8ea"/><text x="771" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">4</text><text x="761" y="114" font-size="18" font-weight="700" fill="#f0f6fc">Gold-set eval</text><text x="761" y="138" font-size="13" fill="#9da7b3">cheapest model that passes</text><line x1="945" y1="96" x2="974" y2="96" stroke="#2fb8ea" stroke-width="2.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><path d="M972 90 L980 96 L972 102" fill="none" stroke="#2fb8ea" stroke-width="2.5"/><rect x="984" y="40" width="196" height="112" rx="14" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/><circle cx="1012" cy="70" r="13" fill="#22d3ee"/><text x="1012" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">5</text><text x="1002" y="114" font-size="18" font-weight="700" fill="#f0f6fc">Explicit outcomes</text><text x="1002" y="138" font-size="13" fill="#9da7b3">success · partial · failed</text></g>
